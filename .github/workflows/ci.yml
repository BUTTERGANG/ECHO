name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Typecheck, lint, build, smoke-test
    runs-on: ubuntu-latest
    # Mirrors .replit (modules = ["nodejs-22"], [deployment] build/run) so a
    # green run here means the Autoscale deploy and the Replit preview pane
    # should both load too.
    env:
      PORT: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web bundle
        run: npm run build:web

      - name: Start server
        run: |
          nohup npm run serve > server.log 2>&1 &
          echo $! > server.pid

      - name: Smoke test (mirrors .replit run + Replit preview pane checks)
        run: npm run smoke

      - name: Server log
        if: always()
        run: cat server.log || true

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
